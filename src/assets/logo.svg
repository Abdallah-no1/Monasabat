<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@700&amp;display=swap');
      
      .bg { fill: #0000; }
      .circle { fill: #ffffff; }
      
      /* أضفنا قائمة قوية للخطوط البديلة في حال لم يحمل خط الإسكندرية */
      .text {
        fill: #ffffff;
        font-family: 'Alexandria', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
        font-size: 50px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      
      .icon-outline {
        fill: none;
        stroke: #1c1d1f;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg"/>

  <g transform="translate(25, 0)">
    <circle cx="60" cy="60" r="45" class="circle"/>
    
    <g transform="rotate(-20, 60, 60) translate(0, 5)">
      <rect x="25" y="52" width="6" height="8" rx="2" class="icon-outline" />
      <line x1="31" y1="56" x2="35" y2="56" class="icon-outline" />
      
      <path d="M 35,51 L 65,51 C 75,51 80,35 95,35 L 95,77 C 80,77 75,61 65,61 L 35,61 Z" class="icon-outline" />
      
      <line x1="44" y1="51" x2="44" y2="38" class="icon-outline" />
      <line x1="51" y1="51" x2="51" y2="38" class="icon-outline" />
      <line x1="58" y1="51" x2="58" y2="38" class="icon-outline" />
      
      <line x1="42" y1="38" x2="46" y2="38" class="icon-outline" />
      <line x1="49" y1="38" x2="53" y2="38" class="icon-outline" />
      <line x1="56" y1="38" x2="60" y2="38" class="icon-outline" />
    </g>
  </g>

  <text x="145" y="78" class="text">مناسبات</text>
</svg>
